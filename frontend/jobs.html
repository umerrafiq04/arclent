<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Listings — Arclent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/neo-dashboard.css" />
</head>
<body class="neo">
  <header class="app-header">
    <div class="brand-group">
      <div class="brand"><span class="neo-logo-mark">A</span> Arclent</div>
      <small class="app-header-subtitle">Public Jobs</small>
    </div>
    <nav class="top-nav">
      <a href="/recruiter.html" id="dashboard-nav-link">Dashboard</a>
      <a href="/jobs.html" class="active">Public Jobs</a>
      <button type="button" id="logout-btn" class="top-nav-logout" style="display: none">Log out</button>
    </nav>
    <button id="nav-toggle" class="nav-toggle" type="button" aria-label="Toggle menu">☰</button>
  </header>

  <main class="page-container">
    <div id="list-view">
      <h1 class="page-title">Available Jobs</h1>
      <div id="jobs-grid" class="jobs-grid"></div>
    </div>

    <div id="detail-view" style="display: none">
      <a href="#" id="back-link" class="detail-back">&larr; Back to all jobs</a>
      <div id="detail-body"></div>
    </div>
  </main>

  <div id="apply-modal-overlay" class="modal-overlay" style="display: none">
    <div class="modal">
      <h2>Applications Coming Soon</h2>
      <p>Online applications for this role aren't open yet — check back soon.</p>
      <button type="button" id="apply-modal-close" class="btn btn-primary">Got it</button>
    </div>
  </div>

  <script src="/js/api.js"></script>
  <script src="/js/dates.js"></script>
  <script src="/js/nav.js"></script>
  <script src="/js/jobs.js"></script>
</body>
</html>
