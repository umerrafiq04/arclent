<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — Arclent</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Inter:wght@700;800;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="stylesheet" href="/css/neo-dashboard.css" />
</head>
<body class="neo">
  <header class="app-header">
    <div class="brand"><span class="neo-logo-mark">A</span> Arclent</div>
  </header>

  <main class="auth-page">
    <section class="card auth-card">
      <div class="auth-tabs">
        <button type="button" class="auth-tab active" id="tab-signin">Sign In</button>
        <button type="button" class="auth-tab" id="tab-signup">Sign Up</button>
      </div>

      <form id="signin-form" class="profile-form auth-form">
        <div id="signin-error" class="error-banner" style="display: none"></div>
        <label>Email<input type="email" name="email" autocomplete="email" required /></label>
        <label>Password<input type="password" name="password" autocomplete="current-password" required /></label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Sign In</button>
        </div>
      </form>

      <form id="signup-form" class="profile-form auth-form" style="display: none">
        <div id="signup-error" class="error-banner" style="display: none"></div>
        <label>Your Name<input type="text" name="name" autocomplete="name" required /></label>
        <label>Work Email<input type="email" name="email" autocomplete="email" required /></label>
        <label>Password<input type="password" name="password" autocomplete="new-password" required minlength="8" /></label>
        <label>Company Name<input type="text" name="company_name" required /></label>
        <label><span>Industry <small>(optional)</small></span><input type="text" name="industry" /></label>
        <div class="form-actions">
          <button type="submit" class="btn btn-primary">Create Account</button>
        </div>
      </form>
    </section>

    <span class="auth-admin-link">Admin</span>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
